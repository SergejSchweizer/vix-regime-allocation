name: Temp Step2 README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.head_commit.message == 'OPS — Prepare Step 2 README status' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status branch
        uses: actions/checkout@v4
        with:
          ref: ops-step-2-readme-status
          fetch-depth: 0
      - name: Update README status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '| Steps 2–4 implementation | Not started |'
          new = ('| Step 2 implementation | Complete: PR-06 through PR-16 and PR-21/PR-22 merged; '
                 'Markov/HMM tables, figures, canonical state paths, executed notebook, and scientific references available |\n'
                 '| Steps 3–4 implementation | Not started |')
          if old not in text:
              raise SystemExit('Expected Step 2–4 status line not found.')
          text = text.replace(old, new, 1)
          text = text.replace(
              'Implement both assignment families with exactly two and three states:',
              'Implemented both assignment families with exactly two and three states:',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "OPS — Mark Step 2 complete"
          git push origin HEAD:ops-step-2-readme-status

  cleanup:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary controller
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_step2_readme.yml
          git commit -m "OPS — Cleanup Step 2 README controller"
          git push origin HEAD:main
