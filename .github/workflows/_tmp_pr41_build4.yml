name: Temporary PR-41 Build 4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'OPS — Trigger PR-41 build 4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-41-notebook-step5-metrics-cumulative-comparison
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
          python scripts/_tmp_fix_pr41.py
          python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 notebooks/gwp2_vix_regime_allocation.ipynb
          ruff check notebooks/gwp2_vix_regime_allocation.ipynb
          test -s reports/tables/step5_performance_summary.csv
          test -s reports/figures/step5_cumulative_performance.png
          rm -f scripts/_tmp_build_pr41.py scripts/_tmp_fix_pr41.py .github/_tmp_pr41_diag.log .github/_tmp_pr41_diag2.log .github/_tmp_pr41_diag3.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/gwp2_vix_regime_allocation.ipynb reports/tables/step5_performance_summary.csv reports/figures/step5_cumulative_performance.png reports/references.bib
          git add -A scripts/_tmp_build_pr41.py scripts/_tmp_fix_pr41.py .github/_tmp_pr41_diag.log .github/_tmp_pr41_diag2.log .github/_tmp_pr41_diag3.log
          git commit -m 'PR-41 — Notebook Step5 metrics + cumulative comparison'
          git push origin HEAD:pr-41-notebook-step5-metrics-cumulative-comparison
  cleanup:
    if: always() && github.event.head_commit.message == 'OPS — Trigger PR-41 build 4'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          rm -f .github/workflows/_tmp_pr41_build4.yml .github/_tmp_pr41_build4_trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/_tmp_pr41_build4.yml .github/_tmp_pr41_build4_trigger
          git commit -m 'OPS — Remove PR-41 build 4'; git push origin HEAD:main
