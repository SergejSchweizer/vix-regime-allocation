name: Fix PR-05 notebook lint

on:
  push:
    branches:
      - pr-05-canonical-notebook-step-1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: pr-05-canonical-notebook-step-1
          fetch-depth: 0

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'

      - name: Fix notebook lint
        run: ruff check --fix notebooks/gwp2_vix_regime_allocation.ipynb

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git rm .github/workflows/fix-pr05-notebook-lint.yml
          git add notebooks/gwp2_vix_regime_allocation.ipynb
          git diff --cached --check
          git commit -m "PR-05 — Canonical notebook Step 1"
          git push origin HEAD:pr-05-canonical-notebook-step-1
