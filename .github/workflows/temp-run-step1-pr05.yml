name: Temporary diagnose Step 1 PR05 notebook

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'CHORE — diagnose Step1 PR05'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-05-canonical-notebook-step-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute and persist diagnostic
        shell: bash
        run: |
          set +e
          LOG=.step1-notebook-execution.log
          : > "$LOG"
          python -m pip install --upgrade pip >> "$LOG" 2>&1
          INSTALL1=$?
          pip install -e ".[dev]" >> "$LOG" 2>&1
          INSTALL2=$?
          pip install nbformat nbclient nbconvert ipykernel >> "$LOG" 2>&1
          INSTALL3=$?
          if [ "$INSTALL1" -eq 0 ] && [ "$INSTALL2" -eq 0 ] && [ "$INSTALL3" -eq 0 ]; then
            jupyter nbconvert --to notebook --execute notebooks/gwp2_vix_regime_allocation.ipynb --inplace --ExecutePreprocessor.timeout=600 >> "$LOG" 2>&1
            NB=$?
          else
            NB=99
          fi
          printf '\nINSTALL1=%s INSTALL2=%s INSTALL3=%s NOTEBOOK=%s\n' "$INSTALL1" "$INSTALL2" "$INSTALL3" "$NB" >> "$LOG"
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git add "$LOG" notebooks/gwp2_vix_regime_allocation.ipynb
          git commit -m "DIAG — Step 1 notebook execution" || true
          git push origin HEAD:pr-05-canonical-notebook-step-1
          exit 0
