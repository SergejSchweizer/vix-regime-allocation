name: Temporary finalize cleaned Step 1 PR05

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'CHORE — finalize cleaned PR05'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-05-canonical-notebook-step-1
          fetch-depth: 0
      - name: Synchronize README and validate executed notebook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = [
              (
                  '| Step 1 implementation | PR-01 Yahoo adjusted-close loader implemented; PR-02 through PR-05 pending |',
                  '| Step 1 implementation | Complete - PR-01 Yahoo adjusted-close loader implemented; PR-02 common-sample transformation, PR-03 figures, PR-04 executable pipeline/artifacts, and PR-05 executed notebook/citations complete |',
              ),
              (
                  'Use Yahoo Finance adjusted closes for `TLT`, `GLD`, `SPY`, and `^VIX`, maximum common dates, no imputation, ETF daily log returns, and daily VIX first difference. PR-01 implements the deterministic adjusted-close loader with explicit Yahoo arguments, `Adj Close` extraction, `^VIX`→`VIX` renaming, canonical column order, timezone-naive sorted unique `Date` index, positive/finite non-missing price validation, and mocked offline tests. Missing price observations are intentionally preserved for PR-02, which constructs the common-date sample.',
                  'Step 1 is complete. PR-01 downloads Yahoo Finance adjusted closes for `TLT`, `GLD`, `SPY`, and `^VIX`; PR-02 constructs the maximum common sample with no imputation and computes ETF daily log returns plus the VIX first difference; PR-03 produces the two required figures; PR-04 executes the pipeline and persists the canonical data/figures; PR-05 provides the fully executed technical notebook and verified scientific-source registry. Step 2 and later results are not claimed here.',
              ),
              (
                  '''Canonical Step 1 outputs planned across PR-01 through PR-05 are:

```text
data/processed/step1_data.csv
reports/figures/step1_etf_log_returns.png
reports/figures/step1_vix_change.png
```''',
                  '''Canonical Step 1 artifacts are:

```text
data/processed/step1_data.csv
reports/figures/step1_etf_log_returns.png
reports/figures/step1_vix_change.png
notebooks/gwp2_vix_regime_allocation.ipynb
reports/references.bib
```''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'README replacement anchor count={text.count(old)} for {old[:50]!r}')
              text = text.replace(old, new, 1)
          readme.write_text(text, encoding='utf-8')

          notebook = json.loads(Path('notebooks/gwp2_vix_regime_allocation.ipynb').read_text(encoding='utf-8'))
          code_cells = [cell for cell in notebook['cells'] if cell['cell_type'] == 'code']
          if not code_cells or any(cell.get('execution_count') is None for cell in code_cells):
              raise SystemExit('Notebook contains missing execution counts.')
          if any(
              output.get('output_type') == 'error'
              for cell in code_cells
              for output in cell.get('outputs', [])
          ):
              raise SystemExit('Notebook contains an execution error output.')
          png_count = sum(
              1
              for cell in code_cells
              for output in cell.get('outputs', [])
              if 'image/png' in output.get('data', {})
          )
          if png_count < 2:
              raise SystemExit(f'Expected at least two stored PNG outputs, found {png_count}.')
          markdown = '\n'.join(''.join(cell.get('source', [])) for cell in notebook['cells'] if cell['cell_type'] == 'markdown')
          for fragment in ('(Whaley 98-105)', '(Cboe Global Markets)', 'Source note.', 'Works Cited', 'Greek letter used below'):
              if fragment not in markdown:
                  raise SystemExit(f'Missing notebook citation/content fragment: {fragment}')
          bib = Path('reports/references.bib').read_text(encoding='utf-8')
          keys = re.findall(r'@\w+\{([^,]+),', bib)
          if set(keys) != {'whaley2009vix', 'cboe2019vixfaq'} or len(keys) != len(set(keys)):
              raise SystemExit(f'Invalid bibliography keys: {keys}')
          print(f'Validated {len(code_cells)} executed code cells and {png_count} stored PNG outputs.')
          PY
          python scripts/check_readme_sidecar.py
          python scripts/check_backlog_contract.py
      - name: Restore clean PR05 file set and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git fetch origin main
          git show 8b2cd791b767def98982b0e18bcf49dbd3b91c19:.github/workflows/quality-gates.yml > .github/workflows/quality-gates.yml
          git rm -f .github/workflows/finalize-step1-notebook.yml
          git rm -f .step1-notebook-finalization-trigger
          git rm -f .step1-notebook-execution.log
          git add README.md notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib .github/workflows/quality-gates.yml
          git commit -m "PR-05 — Canonical notebook Step 1"
          git push origin HEAD:pr-05-canonical-notebook-step-1
