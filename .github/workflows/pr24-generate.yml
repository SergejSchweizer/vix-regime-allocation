name: PR24 Generate Notebook

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.pull_request.head.ref == 'pr-24-notebook-step-3-state-conditional-etf-analysis' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: pr-24-notebook-step-3-state-conditional-etf-analysis
          fetch-depth: 0
      - name: Synchronize main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ipykernel
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Build and execute Step 3 state analysis
        run: |
          python scripts/_tmp_build_pr24.py
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1200 \
            notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Verify canonical statistics artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('.')
          selected_meta = json.loads(
              (root / 'reports/generated/step3_selected_model.json').read_text()
          )
          stats = pd.read_csv(root / 'reports/tables/step3_state_asset_statistics.csv')
          assert list(stats.columns) == [
              'state','asset','mean_log_return','std_log_return','observations'
          ]
          assert len(stats) == 3 * int(selected_meta['n_states'])
          expected = [
              (state, asset)
              for state in range(int(selected_meta['n_states']))
              for asset in ('TLT','GLD','SPY')
          ]
          assert list(zip(stats['state'], stats['asset'])) == expected
          assert stats['observations'].gt(0).all()
          figure = root / 'reports/figures/step3_state_asset_statistics.png'
          assert figure.is_file() and figure.stat().st_size > 0
          PY
      - name: Commit generated artifacts and remove one-shot generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_tmp_build_pr24.py .github/workflows/pr24-generate.yml
          git add -f notebooks/gwp2_vix_regime_allocation.ipynb \
            reports/tables/step3_state_asset_statistics.csv \
            reports/figures/step3_state_asset_statistics.png
          git commit -m "PR-24 — Notebook Step 3 state-conditional ETF analysis [generated]"
          git push origin HEAD:pr-24-notebook-step-3-state-conditional-etf-analysis
