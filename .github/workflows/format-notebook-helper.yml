name: Format Notebook Helper

on:
  push:
    branches:
      - refactor/notebook-orchestration-only
    paths:
      - .github/workflows/format-notebook-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'
      - name: Format notebook helpers
        run: ruff format src/vix_regime_allocation/notebook_helpers.py src/vix_regime_allocation/notebook_sensitivity.py
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/vix_regime_allocation/notebook_helpers.py src/vix_regime_allocation/notebook_sensitivity.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vix_regime_allocation/notebook_helpers.py src/vix_regime_allocation/notebook_sensitivity.py
          git commit -m "REFACTOR — format notebook helper modules"
          git push
