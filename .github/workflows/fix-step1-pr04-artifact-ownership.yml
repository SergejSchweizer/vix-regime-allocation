name: Step1 PR04 artifact ownership updater

on:
  push:
    branches:
      - fix-step1-pr04-artifact-ownership

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'CHORE — trigger Step1 ownership updater'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-step1-pr04-artifact-ownership
          fetch-depth: 0

      - name: Update PR-04 complete write set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('BACKLOG.md')
          text = path.read_text(encoding='utf-8')
          old = '''```text
          scripts/run_step1.py
          tests/test_run_step1.py
          ```'''
          new = '''```text
          scripts/run_step1.py
          tests/test_run_step1.py
          data/processed/step1_data.csv
          reports/figures/step1_etf_log_returns.png
          reports/figures/step1_vix_change.png
          ```'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one PR-04 owned-files block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/check_backlog_contract.py

      - name: Commit canonical backlog only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git rm .github/workflows/fix-step1-pr04-artifact-ownership.yml
          git rm .step1-pr04-artifact-ownership-trigger
          git add BACKLOG.md
          git commit -m "FIX — Step 1 PR-04 artifact ownership"
          git push origin HEAD:fix-step1-pr04-artifact-ownership
