name: Notebook PDF Sidecar Sync

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
      - name: Refresh canonical notebook for cumulative-visual review
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'report-sidecar-cumulative-visual'
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=900 \
            notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Build PDF sidecar from canonical notebook
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python scripts/build_pdf_report.py
      - name: Validate notebook-sidecar contract
        run: |
          test -s reports/Stochastic_Modeling_GWP2_Report.pdf
          test -s reports/figures/step5_cumulative_performance.png
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import nbformat
          from pypdf import PdfReader

          report = Path('reports/Stochastic_Modeling_GWP2_Report.pdf')
          template = Path('reports/Template_Stochastic_Modeling_Group_Work_Project.pdf')
          notebook_path = Path('notebooks/gwp2_vix_regime_allocation.ipynb')
          notebook = nbformat.read(notebook_path, as_version=4)
          reader = PdfReader(report)
          metadata = reader.metadata
          expected_sha = hashlib.sha256(notebook_path.read_bytes()).hexdigest()

          assert len(reader.pages) >= 2
          assert report.stat().st_size > template.stat().st_size
          assert notebook_path.stat().st_size > 0
          assert not any(
              output.get('output_type') == 'error'
              for cell in notebook.cells
              if cell.cell_type == 'code'
              for output in cell.get('outputs', [])
          )
          assert metadata.get('/ArtifactRole') == 'notebook-sidecar'
          assert metadata.get('/SourceOfTruth') == 'notebooks/gwp2_vix_regime_allocation.ipynb'
          assert metadata.get('/NotebookSHA256') == expected_sha
          PY
      - name: Commit synchronized notebook artifacts to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if test -z "$(git status --porcelain -- notebooks/gwp2_vix_regime_allocation.ipynb reports/figures/step5_cumulative_performance.png reports/Stochastic_Modeling_GWP2_Report.pdf)"; then
            echo 'Notebook visual and PDF sidecar already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            notebooks/gwp2_vix_regime_allocation.ipynb \
            reports/figures/step5_cumulative_performance.png \
            reports/Stochastic_Modeling_GWP2_Report.pdf
          git commit -m 'Sync notebook visual and PDF sidecar [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
