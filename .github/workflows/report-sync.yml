name: Notebook PDF Sidecar Sync

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notebook-artifact-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-report:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout report branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install project and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
      - name: Validate notebook LaTeX formatting
        run: python scripts/check_notebook_latex.py notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Check whether canonical artifacts are current
        id: freshness
        continue-on-error: true
        run: python scripts/check_artifact_provenance.py
      - name: Rebuild deterministic analysis artifacts
        if: steps.freshness.outcome != 'success'
        run: python scripts/rebuild_analysis_review.py
      - name: Validate orchestration-only notebook
        if: steps.freshness.outcome != 'success'
        run: python scripts/check_notebook_orchestration.py
      - name: Execute canonical notebook top to bottom
        if: steps.freshness.outcome != 'success'
        run: >-
          python -m jupyter nbconvert --to notebook --execute --inplace
          --ExecutePreprocessor.timeout=1200 notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Stamp deterministic source provenance
        if: steps.freshness.outcome != 'success'
        run: |
          python - <<'PY'
          import nbformat
          from scripts.check_artifact_provenance import NOTEBOOK, SOURCE_DIGEST_KEY, compute_source_sha256

          notebook = nbformat.read(NOTEBOOK, as_version=4)
          notebook.metadata[SOURCE_DIGEST_KEY] = compute_source_sha256()
          nbformat.validate(notebook)
          nbformat.write(notebook, NOTEBOOK)
          PY
      - name: Revalidate notebook LaTeX after rebuild
        if: steps.freshness.outcome != 'success'
        run: python scripts/check_notebook_latex.py notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Export HTML from executed notebook
        if: steps.freshness.outcome != 'success'
        run: >-
          python -m jupyter nbconvert --to html
          --output-dir reports --output gwp2_vix_regime_allocation
          notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Stamp HTML notebook provenance
        if: steps.freshness.outcome != 'success'
        run: |
          python - <<'PY'
          from scripts.check_artifact_provenance import HTML, compute_source_sha256, notebook_sha256

          prefix = (
              f'<!-- ArtifactSourceSHA256:{compute_source_sha256()} '
              f'NotebookSHA256:{notebook_sha256()} -->\n'
          )
          html = HTML.read_text(encoding='utf-8')
          if html.startswith('<!-- ArtifactSourceSHA256:'):
              html = html.split('-->\n', 1)[1]
          HTML.write_text(prefix + html, encoding='utf-8')
          PY
      - name: Build PDF sidecar from executed notebook
        if: steps.freshness.outcome != 'success'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python scripts/build_pdf_report.py
      - name: Validate rendered PDF mathematics
        run: python scripts/check_pdf_latex.py reports/Stochastic_Modeling_GWP2_Report.pdf
      - name: Verify numerical and artifact consistency
        run: |
          python scripts/check_analysis_consistency.py
          python scripts/check_artifact_provenance.py
          pytest -q tests/test_notebook_cumulative_visual.py
      - name: Commit synchronized canonical artifacts
        if: github.event_name == 'pull_request' && steps.freshness.outcome != 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            notebooks/gwp2_vix_regime_allocation.ipynb \
            reports/gwp2_vix_regime_allocation.html \
            reports/Stochastic_Modeling_GWP2_Report.pdf \
            reports/figures \
            reports/tables \
            reports/generated/step3_selected_model.json \
            reports/generated/steps_2_4_manifest.json \
            reports/generated/step5_manifest.json
          if git diff --cached --quiet; then
            echo 'Canonical notebook, HTML, PDF, and generated analysis artifacts are synchronized.'
            exit 0
          fi
          git commit -m 'Sync executed notebook and report sidecars'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload canonical notebook and reports
        uses: actions/upload-artifact@v4
        with:
          name: canonical-notebook-report
          path: |
            notebooks/gwp2_vix_regime_allocation.ipynb
            reports/gwp2_vix_regime_allocation.html
            reports/Stochastic_Modeling_GWP2_Report.pdf
            reports/figures/step5_cumulative_performance.png
          if-no-files-found: error
