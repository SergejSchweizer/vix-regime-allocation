name: Notebook PDF Report Sync

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Build template-based notebook PDF
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python scripts/build_pdf_report.py
      - name: Validate generated PDF
        run: |
          test -s reports/Stochastic_Modeling_GWP2_Report.pdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          report = Path('reports/Stochastic_Modeling_GWP2_Report.pdf')
          template = Path('reports/Template_Stochastic_Modeling_Group_Work_Project.pdf')
          notebook = Path('notebooks/gwp2_vix_regime_allocation.ipynb')
          reader = PdfReader(report)
          assert len(reader.pages) >= 2
          assert report.stat().st_size > template.stat().st_size
          assert notebook.stat().st_size > 0
          assert reader.metadata.get('/NotebookSHA256')
          PY
      - name: Commit synchronized report to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if test -z "$(git status --porcelain -- reports/Stochastic_Modeling_GWP2_Report.pdf)"; then
            echo 'PDF report already matches the notebook.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/Stochastic_Modeling_GWP2_Report.pdf
          git commit -m 'Sync PDF report with notebook [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
