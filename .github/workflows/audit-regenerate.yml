name: Audit Regenerate Canonical Artifacts

on:
  push:
    branches:
      - audit/complete-verification-fixes

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'AUDIT — Commit regenerated analysis artifacts'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/complete-verification-fixes
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and notebook kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ipykernel
      - name: Rebuild canonical analysis layers
        run: python scripts/rebuild_analysis_review.py
      - name: Execute canonical notebook
        run: >-
          python -m jupyter nbconvert
          --to notebook
          --execute
          --inplace
          --ExecutePreprocessor.timeout=900
          notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Export executed notebook HTML
        run: >-
          python -m jupyter nbconvert
          --to html
          --output gwp2_vix_regime_allocation
          --output-dir reports
          notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Build template-based notebook PDF
        run: python scripts/build_pdf_report.py
      - name: Commit regenerated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/gwp2_vix_regime_allocation.ipynb \
            reports/gwp2_vix_regime_allocation.html \
            reports/Stochastic_Modeling_GWP2_Report.pdf \
            reports/figures \
            reports/tables/step5_state_count_sensitivity.csv \
            reports/generated/step5_manifest.json
          if git diff --cached --quiet; then
            echo 'No regenerated changes to commit.'
            exit 0
          fi
          git commit -m 'AUDIT — Commit regenerated analysis artifacts'
          git push origin HEAD:audit/complete-verification-fixes
