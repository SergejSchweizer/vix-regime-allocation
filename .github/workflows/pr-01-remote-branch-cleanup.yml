name: PR-01 remote branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'PR-01 — Yahoo adjusted-close loader: execute remote branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete non-main remote branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            "heads/pr-01-yahoo-adjusted-close-loader" \
            "heads/audit/backlog-completeness-v2"
          do
            encoded_ref="${ref//\//%2F}"
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/${encoded_ref}"
          done

      - name: Remove cleanup artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git rm .github/workflows/pr-01-remote-branch-cleanup.yml
          git rm .pr01-remote-cleanup-trigger
          git commit -m "PR-01 — Yahoo adjusted-close loader: remove remote cleanup artifacts"
          git push origin HEAD:main
