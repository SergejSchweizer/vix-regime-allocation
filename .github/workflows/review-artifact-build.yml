name: Review Analysis Artifact Build

on:
  push:
    branches:
      - project-review-finalize-artifacts

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'REVIEW — Trigger canonical artifact commit'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: project-review-finalize-artifacts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
      - name: Rebuild analysis artifacts and notebook sources
        run: python scripts/rebuild_analysis_review.py
      - name: Execute full notebook
        run: >-
          python -m jupyter nbconvert --to notebook --execute --inplace
          --ExecutePreprocessor.timeout=1200 notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Validate generated artifacts
        run: |
          test -s reports/tables/step5_state_count_sensitivity.csv
          test -s reports/generated/step5_manifest.json
          test -s reports/figures/step1_etf_log_returns.png
          test -s reports/figures/step2_markov_vix_states.png
          test -s reports/figures/step2_hmm_vix_states.png
          test -s reports/figures/step2_hmm_smoothed_probabilities.png
          test -s reports/figures/step3_state_asset_statistics.png
          test -s reports/figures/step5_cumulative_performance.png
          ruff check src tests scripts notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Commit canonical generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/gwp2_vix_regime_allocation.ipynb
          git add reports/tables/step5_state_count_sensitivity.csv
          git add reports/generated/step5_manifest.json
          git add reports/figures/step1_etf_log_returns.png
          git add reports/figures/step1_vix_change.png
          git add reports/figures/step2_markov_vix_states.png
          git add reports/figures/step2_hmm_vix_states.png
          git add reports/figures/step3_state_asset_statistics.png
          git add reports/figures/step5_cumulative_performance.png
          git commit -m 'REVIEW — Commit rebuilt analysis artifacts'
          git push origin HEAD:project-review-finalize-artifacts
