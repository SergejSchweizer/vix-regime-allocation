name: Temporary PR-42 Builder
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'OPS — Trigger PR-42 builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-42-notebook-step5-sensitivity-manifest
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
          python scripts/_tmp_build_pr42.py
          python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 notebooks/gwp2_vix_regime_allocation.ipynb
          ruff check notebooks/gwp2_vix_regime_allocation.ipynb
          test -s reports/tables/step5_state_count_sensitivity.csv
          test -s reports/generated/step5_manifest.json
          rm scripts/_tmp_build_pr42.py
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib reports/tables/step5_state_count_sensitivity.csv reports/generated/step5_manifest.json
          git add -A scripts/_tmp_build_pr42.py
          git commit -m 'PR-42 — Notebook Step5 sensitivity + manifest'
          git push origin HEAD:pr-42-notebook-step5-sensitivity-manifest
  cleanup:
    if: always() && github.event.head_commit.message == 'OPS — Trigger PR-42 builder'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          rm -f .github/workflows/_tmp_pr42.yml .github/_tmp_pr42_trigger
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/_tmp_pr42.yml .github/_tmp_pr42_trigger
          git commit -m 'OPS — Remove PR-42 builder'; git push origin HEAD:main
