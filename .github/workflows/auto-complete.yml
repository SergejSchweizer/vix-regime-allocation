name: Auto Complete

on:
  workflow_run:
    workflows:
      - Quality Gates
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: auto-complete
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No pull request is associated with this Quality Gates run; nothing to merge."
            exit 0
          fi

          state="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state --jq '.state')"
          draft="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          base="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json baseRefName --jq '.baseRefName')"
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')"

          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is not open; nothing to merge."
            exit 0
          fi

          if [ "$draft" != "false" ]; then
            echo "PR #$PR_NUMBER is still a draft; skipping auto-complete."
            exit 0
          fi

          if [ "$base" != "main" ]; then
            echo "PR #$PR_NUMBER targets '$base', not 'main'; skipping auto-complete."
            exit 0
          fi

          if [ "$head_sha" != "$VERIFIED_HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER changed after the successful Quality Gates run; skipping stale merge."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --merge --delete-branch
