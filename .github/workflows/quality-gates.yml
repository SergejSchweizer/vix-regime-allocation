name: Quality Gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check src tests scripts

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: coverage run --data-file=.coverage.unit -m pytest -q -m "not integration"
      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests with coverage
        run: coverage run --data-file=.coverage.integration -m pytest -q -m integration
      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  readme-sidecar:
    name: readme-sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate README sidecar contract
        run: python scripts/check_readme_sidecar.py

  backlog-contract:
    name: backlog-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical backlog contract
        run: python scripts/check_backlog_contract.py

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage
        run: coverage combine coverage-data
      - name: Enforce 90 percent coverage
        run: coverage report --fail-under=90
      - name: Create XML coverage report
        run: coverage xml -o coverage.xml
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - type-check
      - unit-tests
      - integration-tests
      - readme-sidecar
      - backlog-contract
      - coverage
    steps:
      - name: Require every quality gate
        env:
          LINT: ${{ needs.lint.result }}
          TYPE_CHECK: ${{ needs['type-check'].result }}
          UNIT_TESTS: ${{ needs['unit-tests'].result }}
          INTEGRATION_TESTS: ${{ needs['integration-tests'].result }}
          README_SIDECAR: ${{ needs['readme-sidecar'].result }}
          BACKLOG_CONTRACT: ${{ needs['backlog-contract'].result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          test "$LINT" = "success"
          test "$TYPE_CHECK" = "success"
          test "$UNIT_TESTS" = "success"
          test "$INTEGRATION_TESTS" = "success"
          test "$README_SIDECAR" = "success"
          test "$BACKLOG_CONTRACT" = "success"
          test "$COVERAGE" = "success"
