name: Quality Gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check src tests scripts

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: coverage run --data-file=.coverage.unit -m pytest -q -m "not integration"
      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests with coverage
        run: coverage run --data-file=.coverage.integration -m pytest -q -m integration
      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  readme-sidecar:
    name: readme-sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate README sidecar contract
        run: python scripts/check_readme_sidecar.py

  backlog-contract:
    name: backlog-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical backlog contract
        run: python scripts/check_backlog_contract.py

  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject temporary and active legacy files
        run: python scripts/check_repository_hygiene.py

  analysis-consistency:
    name: analysis-consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Recompute and verify canonical numerical artifacts
        env:
          MPLBACKEND: Agg
        run: python scripts/check_analysis_consistency.py
      - name: Enforce HMM-only canonical artifact contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          required = (
              "reports/tables/step4_allocation_100_keep.csv",
              "reports/tables/step4_allocation_60_40_spread.csv",
              "reports/tables/step5_performance_summary.csv",
              "reports/tables/step5_state_count_sensitivity.csv",
              "reports/generated/step3_selected_model.json",
              "reports/generated/steps_2_4_manifest.json",
              "reports/generated/step5_manifest.json",
              "notebooks/gwp2_vix_regime_allocation.ipynb",
              "reports/gwp2_vix_regime_allocation.html",
              "reports/Stochastic_Modeling_GWP2_Report.pdf",
              "reports/references.bib",
          )
          for name in required:
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 0, name

          with Path("reports/tables/step5_performance_summary.csv").open(
              encoding="utf-8", newline=""
          ) as handle:
              portfolios = [row["portfolio"] for row in csv.DictReader(handle)]
          assert portfolios == [
              "hmm_100_keep",
              "hmm_60_40_spread",
              "equal_weight_monthly",
              "spy_buy_hold",
          ], portfolios

          selected = json.loads(
              Path("reports/generated/step3_selected_model.json").read_text(encoding="utf-8")
          )
          assert selected["family"] == "hmm", selected

          for name in (
              "reports/generated/step3_selected_model.json",
              "reports/generated/steps_2_4_manifest.json",
              "reports/generated/step5_manifest.json",
          ):
              text = Path(name).read_text(encoding="utf-8").lower()
              assert "step2_markov_" not in text, name
              assert "step4_allocation_mapping.csv" not in text, name

          notebook = json.loads(
              Path("notebooks/gwp2_vix_regime_allocation.ipynb").read_text(encoding="utf-8")
          )
          notebook_text = json.dumps(notebook, ensure_ascii=False)
          bibliography = Path("reports/references.bib").read_text(encoding="utf-8")
          for author in ("Baum", "Rabiner", "Viterbi", "Akaike", "Schwarz"):
              assert author in notebook_text, f"notebook citation missing: {author}"
              assert author.lower() in bibliography.lower(), f"bibliography entry missing: {author}"
          assert "Works Cited" in notebook_text
          PY

  artifact-provenance:
    name: artifact-provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify notebook HTML PDF provenance
        run: python scripts/check_artifact_provenance.py

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage
        run: coverage combine coverage-data
      - name: Enforce 90 percent coverage
        run: coverage report --fail-under=90
      - name: Create XML coverage report
        run: coverage xml -o coverage.xml
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - type-check
      - unit-tests
      - integration-tests
      - readme-sidecar
      - backlog-contract
      - repository-hygiene
      - analysis-consistency
      - artifact-provenance
      - coverage
    steps:
      - name: Require every quality gate
        env:
          LINT: ${{ needs.lint.result }}
          TYPE_CHECK: ${{ needs['type-check'].result }}
          UNIT_TESTS: ${{ needs['unit-tests'].result }}
          INTEGRATION_TESTS: ${{ needs['integration-tests'].result }}
          README_SIDECAR: ${{ needs['readme-sidecar'].result }}
          BACKLOG_CONTRACT: ${{ needs['backlog-contract'].result }}
          REPOSITORY_HYGIENE: ${{ needs['repository-hygiene'].result }}
          ANALYSIS_CONSISTENCY: ${{ needs['analysis-consistency'].result }}
          ARTIFACT_PROVENANCE: ${{ needs['artifact-provenance'].result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          test "$LINT" = "success"
          test "$TYPE_CHECK" = "success"
          test "$UNIT_TESTS" = "success"
          test "$INTEGRATION_TESTS" = "success"
          test "$README_SIDECAR" = "success"
          test "$BACKLOG_CONTRACT" = "success"
          test "$REPOSITORY_HYGIENE" = "success"
          test "$ANALYSIS_CONSISTENCY" = "success"
          test "$ARTIFACT_PROVENANCE" = "success"
          test "$COVERAGE" = "success"
