name: Quality Gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: coverage run --data-file=.coverage.unit -m pytest -q -m "not integration"
      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests with coverage
        run: coverage run --data-file=.coverage.integration -m pytest -q -m integration
      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  readme-sidecar:
    name: readme-sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate README sidecar contract
        run: python scripts/check_readme_sidecar.py

  backlog-contract:
    name: backlog-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical backlog contract
        run: python scripts/check_backlog_contract.py

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage
        run: coverage combine coverage-data
      - name: Enforce 90 percent coverage
        run: coverage report --fail-under=90
      - name: Create XML coverage report
        run: coverage xml -o coverage.xml
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  pr05-notebook-executor:
    name: pr05-notebook-executor
    if: github.ref_name == 'main' && github.event.head_commit.message == 'CHORE — execute PR05 notebook'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout PR05
        uses: actions/checkout@v4
        with:
          ref: pr-05-canonical-notebook-step-1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and notebook tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nbformat nbclient nbconvert ipykernel
      - name: Synchronize README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          old = '| Step 1 implementation | PR-01 Yahoo adjusted-close loader implemented; PR-02 through PR-05 pending |'
          new = '| Step 1 implementation | Complete - PR-01 Yahoo adjusted-close loader implemented; PR-02 common-sample transformation, PR-03 figures, PR-04 executable pipeline/artifacts, and PR-05 executed notebook/citations complete |'
          if old not in t:
              raise SystemExit('Step 1 README status anchor missing.')
          t = t.replace(old, new, 1)
          old = 'Use Yahoo Finance adjusted closes for `TLT`, `GLD`, `SPY`, and `^VIX`, maximum common dates, no imputation, ETF daily log returns, and daily VIX first difference. PR-01 implements the deterministic adjusted-close loader with explicit Yahoo arguments, `Adj Close` extraction, `^VIX`→`VIX` renaming, canonical column order, timezone-naive sorted unique `Date` index, positive/finite non-missing price validation, and mocked offline tests. Missing price observations are intentionally preserved for PR-02, which constructs the common-date sample.'
          new = 'Step 1 is complete. PR-01 downloads Yahoo Finance adjusted closes for `TLT`, `GLD`, `SPY`, and `^VIX`; PR-02 constructs the maximum common sample with no imputation and computes ETF daily log returns plus the VIX first difference; PR-03 produces the two required figures; PR-04 executes the pipeline and persists the canonical data/figures; PR-05 provides the fully executed technical notebook and verified scientific-source registry. Step 2 and later results are not claimed here.'
          if old not in t:
              raise SystemExit('Step 1 README paragraph anchor missing.')
          t = t.replace(old, new, 1)
          old = '''Canonical Step 1 outputs planned across PR-01 through PR-05 are:

```text
data/processed/step1_data.csv
reports/figures/step1_etf_log_returns.png
reports/figures/step1_vix_change.png
```'''
          new = '''Canonical Step 1 artifacts are:

```text
data/processed/step1_data.csv
reports/figures/step1_etf_log_returns.png
reports/figures/step1_vix_change.png
notebooks/gwp2_vix_regime_allocation.ipynb
reports/references.bib
```'''
          if old not in t:
              raise SystemExit('Step 1 README artifact anchor missing.')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Execute notebook
        run: jupyter nbconvert --to notebook --execute notebooks/gwp2_vix_regime_allocation.ipynb --inplace --ExecutePreprocessor.timeout=600
      - name: Push finalized PR05
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git fetch origin main
          git checkout origin/main^ -- .github/workflows/quality-gates.yml
          git rm -f .github/workflows/finalize-step1-notebook.yml
          git rm -f .step1-notebook-finalization-trigger
          git add README.md notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib .github/workflows/quality-gates.yml
          git commit -m "PR-05 — Canonical notebook Step 1"
          git push origin HEAD:pr-05-canonical-notebook-step-1

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - type-check
      - unit-tests
      - integration-tests
      - readme-sidecar
      - backlog-contract
      - coverage
    steps:
      - name: Require every quality gate
        env:
          LINT: ${{ needs.lint.result }}
          TYPE_CHECK: ${{ needs['type-check'].result }}
          UNIT_TESTS: ${{ needs['unit-tests'].result }}
          INTEGRATION_TESTS: ${{ needs['integration-tests'].result }}
          README_SIDECAR: ${{ needs['readme-sidecar'].result }}
          BACKLOG_CONTRACT: ${{ needs['backlog-contract'].result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          test "$LINT" = "success"
          test "$TYPE_CHECK" = "success"
          test "$UNIT_TESTS" = "success"
          test "$INTEGRATION_TESTS" = "success"
          test "$README_SIDECAR" = "success"
          test "$BACKLOG_CONTRACT" = "success"
          test "$COVERAGE" = "success"
