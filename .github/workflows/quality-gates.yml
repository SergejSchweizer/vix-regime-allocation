name: Quality Gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: coverage run --data-file=.coverage.unit -m pytest -q -m "not integration"
      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests with coverage
        run: coverage run --data-file=.coverage.integration -m pytest -q -m integration
      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  readme-sidecar:
    name: readme-sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate README sidecar contract
        run: python scripts/check_readme_sidecar.py

  backlog-contract:
    name: backlog-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical backlog contract
        run: python scripts/check_backlog_contract.py

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage
        run: coverage combine coverage-data
      - name: Enforce 90 percent coverage
        run: coverage report --fail-under=90
      - name: Create XML coverage report
        run: coverage xml -o coverage.xml
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  step1-finalize:
    name: step1-finalize
    if: github.ref_name == 'pr-05-canonical-notebook-step-1' || github.head_ref == 'pr-05-canonical-notebook-step-1'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: pr-05-canonical-notebook-step-1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and notebook tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nbformat nbclient nbconvert ipykernel
      - name: Synchronize README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old_status = '| Step 1 implementation | PR-01 Yahoo adjusted-close loader implemented; PR-02 through PR-05 pending |'
          new_status = '| Step 1 implementation | Complete - PR-01 Yahoo adjusted-close loader implemented; PR-02 common-sample transformation, PR-03 figures, PR-04 executable pipeline/artifacts, and PR-05 executed notebook/citations complete |'
          if text.count(old_status) != 1:
              raise SystemExit(f'Expected one Step 1 status line, found {text.count(old_status)}')
          text = text.replace(old_status, new_status, 1)

          old_paragraph = 'Use Yahoo Finance adjusted closes for `TLT`, `GLD`, `SPY`, and `^VIX`, maximum common dates, no imputation, ETF daily log returns, and daily VIX first difference. PR-01 implements the deterministic adjusted-close loader with explicit Yahoo arguments, `Adj Close` extraction, `^VIX`→`VIX` renaming, canonical column order, timezone-naive sorted unique `Date` index, positive/finite non-missing price validation, and mocked offline tests. Missing price observations are intentionally preserved for PR-02, which constructs the common-date sample.'
          new_paragraph = 'Step 1 is complete. PR-01 downloads Yahoo Finance adjusted closes for `TLT`, `GLD`, `SPY`, and `^VIX`; PR-02 constructs the maximum common sample with no imputation and computes ETF daily log returns plus the VIX first difference; PR-03 produces the two required figures; PR-04 executes the pipeline and persists the canonical data/figures; PR-05 provides the fully executed technical notebook and verified scientific-source registry. Step 2 and later results are not claimed here.'
          if text.count(old_paragraph) != 1:
              raise SystemExit(f'Expected one Step 1 implementation paragraph, found {text.count(old_paragraph)}')
          text = text.replace(old_paragraph, new_paragraph, 1)

          old_outputs = '''Canonical Step 1 outputs planned across PR-01 through PR-05 are:

```text
data/processed/step1_data.csv
reports/figures/step1_etf_log_returns.png
reports/figures/step1_vix_change.png
```'''
          new_outputs = '''Canonical Step 1 artifacts are:

```text
data/processed/step1_data.csv
reports/figures/step1_etf_log_returns.png
reports/figures/step1_vix_change.png
notebooks/gwp2_vix_regime_allocation.ipynb
reports/references.bib
```'''
          if text.count(old_outputs) != 1:
              raise SystemExit(f'Expected one Step 1 outputs block, found {text.count(old_outputs)}')
          text = text.replace(old_outputs, new_outputs, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/check_readme_sidecar.py
          python scripts/check_backlog_contract.py
      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute notebooks/gwp2_vix_regime_allocation.ipynb --inplace --ExecutePreprocessor.timeout=600
      - name: Validate executed notebook and citations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import nbformat

          notebook_path = Path('notebooks/gwp2_vix_regime_allocation.ipynb')
          references_path = Path('reports/references.bib')
          notebook = nbformat.read(notebook_path, as_version=4)
          code_cells = [cell for cell in notebook.cells if cell.cell_type == 'code']
          if not code_cells:
              raise SystemExit('Notebook has no code cells.')
          for cell in code_cells:
              if cell.execution_count is None:
                  raise SystemExit('Notebook contains an unexecuted code cell.')
              if any(output.output_type == 'error' for output in cell.get('outputs', [])):
                  raise SystemExit('Notebook contains a failed code cell.')

          markdown = '\n'.join(cell.source for cell in notebook.cells if cell.cell_type == 'markdown')
          for fragment in (
              'Step 1 - Data Preparation and Exploration',
              'Greek letter used below',
              '(Whaley 98-105)',
              '(Cboe Global Markets)',
              'citekey: whaley2009vix',
              'citekey: cboe2019vixfaq',
              'Source note.',
              'Works Cited',
          ):
              if fragment not in markdown:
                  raise SystemExit(f'Missing required notebook fragment: {fragment}')

          png_outputs = 0
          output_text = ''
          for cell in code_cells:
              for output in cell.get('outputs', []):
                  if output.output_type in {'display_data', 'execute_result'}:
                      if 'image/png' in output.get('data', {}):
                          png_outputs += 1
                      output_text += str(output.get('data', {}).get('text/markdown', ''))
          if png_outputs < 2:
              raise SystemExit(f'Expected at least two stored PNG outputs, found {png_outputs}.')
          if 'Understanding the VIX' not in output_text or 'Cboe VIX FAQ' not in output_text:
              raise SystemExit('Rendered Works Cited output is incomplete.')

          bib = references_path.read_text(encoding='utf-8')
          keys = re.findall(r'@\w+\{([^,]+),', bib)
          if len(keys) != len(set(keys)):
              raise SystemExit('Duplicate bibliography keys detected.')
          if set(keys) != {'whaley2009vix', 'cboe2019vixfaq'}:
              raise SystemExit(f'Unexpected bibliography key set: {keys}')
          for fragment in (
              '10.3905/JPM.2009.35.3.098',
              'The Journal of Portfolio Management',
              'https://www.cboe.com/tradable_products/vix/faqs',
              'updated 8 Oct. 2019',
          ):
              if fragment not in bib:
                  raise SystemExit(f'Missing verified bibliography metadata: {fragment}')
          print(f'Validated {len(code_cells)} executed code cells and {png_outputs} stored figures.')
          PY
      - name: Restore workflow and commit canonical PR-05 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality-gates.yml
          git rm .github/workflows/finalize-step1-notebook.yml
          git rm .step1-notebook-finalization-trigger
          git add README.md notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib .github/workflows/quality-gates.yml
          git commit -m "PR-05 — Canonical notebook Step 1"
          git push origin HEAD:pr-05-canonical-notebook-step-1

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - type-check
      - unit-tests
      - integration-tests
      - readme-sidecar
      - backlog-contract
      - coverage
    steps:
      - name: Require every quality gate
        env:
          LINT: ${{ needs.lint.result }}
          TYPE_CHECK: ${{ needs['type-check'].result }}
          UNIT_TESTS: ${{ needs['unit-tests'].result }}
          INTEGRATION_TESTS: ${{ needs['integration-tests'].result }}
          README_SIDECAR: ${{ needs['readme-sidecar'].result }}
          BACKLOG_CONTRACT: ${{ needs['backlog-contract'].result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          test "$LINT" = "success"
          test "$TYPE_CHECK" = "success"
          test "$UNIT_TESTS" = "success"
          test "$INTEGRATION_TESTS" = "success"
          test "$README_SIDECAR" = "success"
          test "$BACKLOG_CONTRACT" = "success"
          test "$COVERAGE" = "success"
