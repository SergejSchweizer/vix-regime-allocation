name: PR23 Generate Notebook

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.pull_request.head.ref == 'pr-23-notebook-step-3-model-selection-selected-state-provenance' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: pr-23-notebook-step-3-model-selection-selected-state-provenance
          fetch-depth: 0
      - name: Synchronize main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ipykernel
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Build and execute Step 3 notebook
        run: |
          python scripts/_tmp_build_pr23.py
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1200 \
            notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Verify canonical artifacts
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('.')
          comparison = pd.read_csv(root / 'reports/tables/step3_model_comparison.csv')
          assert list(comparison.columns) == [
              'family','n_states','log_likelihood','n_parameters','n_observations',
              'aic','bic','converged','criterion_scope'
          ]
          assert list(zip(comparison['family'], comparison['n_states'])) == [
              ('markov',2),('markov',3),('hmm',2),('hmm',3)
          ]
          assert (comparison['criterion_scope'] == 'within_family_only').all()

          selected = pd.read_csv(root / 'reports/tables/step3_selected_states.csv')
          source_data = pd.read_csv(root / 'data/processed/step1_data.csv')
          assert list(selected.columns) == ['Date','state']
          assert len(selected) == len(source_data)
          assert selected['Date'].equals(source_data['Date'])

          metadata = json.loads((root / 'reports/generated/step3_selected_model.json').read_text())
          assert list(metadata) == [
              'family','n_states','state_source','selection_reason','markov_best_n_states',
              'hmm_best_n_states','input_data_sha256','selected_states_path'
          ]
          assert metadata['selected_states_path'] == 'reports/tables/step3_selected_states.csv'
          actual_hash = hashlib.sha256((root / 'data/processed/step1_data.csv').read_bytes()).hexdigest()
          assert metadata['input_data_sha256'] == actual_hash
          source = pd.read_csv(root / metadata['state_source'])
          assert selected.equals(source)
          PY
      - name: Commit generated artifacts and remove one-shot generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_tmp_build_pr23.py .github/workflows/pr23-generate.yml
          git add -f notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib \
            reports/tables/step3_model_comparison.csv \
            reports/tables/step3_selected_states.csv \
            reports/generated/step3_selected_model.json
          git commit -m "PR-23 — Notebook Step 3 model selection + selected-state provenance [generated]"
          git push origin HEAD:pr-23-notebook-step-3-model-selection-selected-state-provenance
