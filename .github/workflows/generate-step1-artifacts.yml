name: Generate canonical Step 1 artifacts

on:
  push:
    branches:
      - pr-04-executable-step-1-pipeline

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'CHORE — trigger Step 1 artifact generation'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr-04-executable-step-1-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run canonical Step 1 pipeline
        run: python scripts/run_step1.py

      - name: Validate generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          csv_path = Path('data/processed/step1_data.csv')
          etf_path = Path('reports/figures/step1_etf_log_returns.png')
          vix_path = Path('reports/figures/step1_vix_change.png')
          expected = [
              'TLT', 'GLD', 'SPY', 'VIX',
              'TLT_log_return', 'GLD_log_return', 'SPY_log_return', 'VIX_change'
          ]
          if not csv_path.is_file() or csv_path.stat().st_size == 0:
              raise SystemExit('Step 1 CSV missing or empty.')
          frame = pd.read_csv(csv_path, parse_dates=['Date'], index_col='Date')
          if list(frame.columns) != expected:
              raise SystemExit(f'Unexpected Step 1 CSV columns: {list(frame.columns)}')
          if frame.empty or frame.index.has_duplicates or not frame.index.is_monotonic_increasing:
              raise SystemExit('Step 1 CSV index contract failed.')
          if frame.isna().any().any() or not np.isfinite(frame.to_numpy(dtype=float)).all():
              raise SystemExit('Step 1 CSV contains missing/non-finite values.')
          for path in (etf_path, vix_path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Generated figure missing or empty: {path}')
          print(f'Validated {len(frame)} Step 1 observations from {frame.index.min().date()} to {frame.index.max().date()}.')
          PY

      - name: Commit canonical artifacts and remove generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git rm .github/workflows/generate-step1-artifacts.yml
          git rm .step1-artifact-generation-trigger
          git add data/processed/step1_data.csv
          git add reports/figures/step1_etf_log_returns.png
          git add reports/figures/step1_vix_change.png
          git commit -m "PR-04 — Executable Step 1 pipeline"
          git push origin HEAD:pr-04-executable-step-1-pipeline
