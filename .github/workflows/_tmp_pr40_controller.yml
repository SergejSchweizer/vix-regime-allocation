name: Temporary PR-40 Controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'OPS — Build PR-40 Step5 notebook backtest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: pr-40-notebook-step5-backtest-benchmarks
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and notebook kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
      - name: Build Step 5 notebook section
        run: python scripts/_tmp_build_pr40.py
      - name: Execute notebook top to bottom
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=900 \
            notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Verify generated artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          import pandas as pd

          notebook = Path('notebooks/gwp2_vix_regime_allocation.ipynb')
          daily = Path('reports/tables/step5_daily_returns.csv')
          assert notebook.is_file() and notebook.stat().st_size > 0
          assert daily.is_file() and daily.stat().st_size > 0
          frame = pd.read_csv(daily)
          assert list(frame.columns) == [
              'Date', 'regime_rotation', 'equal_weight_monthly', 'spy_buy_hold'
          ]
          assert len(frame) > 100
          nb = nbformat.read(notebook, as_version=4)
          assert any('## Step 5' in c.source for c in nb.cells if c.cell_type == 'markdown')
          assert all(c.get('execution_count') is not None for c in nb.cells if c.cell_type == 'code')
          for cell in nb.cells:
              if cell.cell_type == 'code':
                  assert not any(o.get('output_type') == 'error' for o in cell.get('outputs', []))
          PY
      - name: Commit generated feature artifacts
        run: |
          rm scripts/_tmp_build_pr40.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib \
            reports/tables/step5_daily_returns.csv scripts/_tmp_build_pr40.py
          git commit -m 'PR-40 — Notebook Step5 backtest + benchmarks [generated]'
          git push origin HEAD:pr-40-notebook-step5-backtest-benchmarks

  cleanup:
    if: always() && github.event.head_commit.message == 'OPS — Build PR-40 Step5 notebook backtest'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary controller and trigger
        run: |
          rm -f .github/workflows/_tmp_pr40_controller.yml .github/_tmp_pr40_trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/_tmp_pr40_controller.yml .github/_tmp_pr40_trigger
          if ! git diff --cached --quiet; then
            git commit -m 'OPS — Remove PR-40 controller'
            git push origin HEAD:main
          fi
