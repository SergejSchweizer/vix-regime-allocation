name: Temporary PR-40 Final Controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'OPS — Finalize PR-40 Step5 notebook backtest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-40-notebook-step5-backtest-benchmarks
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build and execute notebook
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
          sed -i 's/repo_root = Path.cwd()/repo_root = Path.cwd().resolve().parent if Path.cwd().name == "notebooks" else Path.cwd().resolve()/' scripts/_tmp_build_pr40.py
          python scripts/_tmp_build_pr40.py
          python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 notebooks/gwp2_vix_regime_allocation.ipynb
          test -s reports/tables/step5_daily_returns.csv
          grep -q '## Step 5' notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Commit generated artifacts
        run: |
          rm -f scripts/_tmp_build_pr40.py .github/_tmp_pr40_build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib reports/tables/step5_daily_returns.csv scripts/_tmp_build_pr40.py .github/_tmp_pr40_build.log
          git commit -m 'PR-40 — Notebook Step5 backtest + benchmarks [generated]'
          git push origin HEAD:pr-40-notebook-step5-backtest-benchmarks

  cleanup:
    if: always() && github.event.head_commit.message == 'OPS — Finalize PR-40 Step5 notebook backtest'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          rm -f .github/workflows/_tmp_pr40_controller.yml .github/_tmp_pr40_trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/_tmp_pr40_controller.yml .github/_tmp_pr40_trigger
          if ! git diff --cached --quiet; then
            git commit -m 'OPS — Remove PR-40 final controller'
            git push origin HEAD:main
          fi
