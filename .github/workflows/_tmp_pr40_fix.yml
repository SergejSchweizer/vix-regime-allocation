name: Temporary PR-40 Notebook Fix

on:
  push:
    branches: [pr-40-notebook-step5-backtest-benchmarks]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'OPS — Trigger PR-40 notebook lint fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-40-notebook-step5-backtest-benchmarks
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
          python scripts/_tmp_fix_pr40.py
          python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 notebooks/gwp2_vix_regime_allocation.ipynb
          ruff check notebooks/gwp2_vix_regime_allocation.ipynb
      - run: |
          rm -f scripts/_tmp_fix_pr40.py .github/workflows/_tmp_pr40_fix.yml .github/_tmp_pr40_fix_trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A notebooks/gwp2_vix_regime_allocation.ipynb scripts/_tmp_fix_pr40.py .github/workflows/_tmp_pr40_fix.yml .github/_tmp_pr40_fix_trigger
          git commit -m 'PR-40 — Notebook Step5 backtest + benchmarks [lint fix]'
          git push origin HEAD:pr-40-notebook-step5-backtest-benchmarks
