name: Temporary Refresh Cumulative Visual

on:
  push:
    branches:
      - report-sidecar-cumulative-visual

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'OPS — Refresh notebook visual and PDF sidecar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: report-sidecar-cumulative-visual
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
      - name: Execute canonical notebook
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=900 \
            notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Build PDF sidecar
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python scripts/build_pdf_report.py
      - name: Validate refreshed visual and sidecar
        run: |
          test -s reports/figures/step5_cumulative_performance.png
          test -s reports/Stochastic_Modeling_GWP2_Report.pdf
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import nbformat
          from pypdf import PdfReader

          notebook_path = Path('notebooks/gwp2_vix_regime_allocation.ipynb')
          notebook = nbformat.read(notebook_path, as_version=4)
          assert not any(
              output.get('output_type') == 'error'
              for cell in notebook.cells
              if cell.cell_type == 'code'
              for output in cell.get('outputs', [])
          )
          metadata = PdfReader('reports/Stochastic_Modeling_GWP2_Report.pdf').metadata
          assert metadata.get('/ArtifactRole') == 'notebook-sidecar'
          assert metadata.get('/NotebookSHA256') == hashlib.sha256(notebook_path.read_bytes()).hexdigest()
          PY
      - name: Commit refreshed artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            notebooks/gwp2_vix_regime_allocation.ipynb \
            reports/figures/step5_cumulative_performance.png \
            reports/Stochastic_Modeling_GWP2_Report.pdf
          if git diff --cached --quiet; then
            echo 'No refreshed artifacts changed.'
            exit 0
          fi
          git commit -m 'SYNC — Refresh cumulative visual and PDF sidecar [skip ci]'
          git push origin HEAD:report-sidecar-cumulative-visual
