name: Temporary Align PDF Sidecar Backlog

on:
  push:
    branches:
      - report-sidecar-cumulative-visual
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'report-sidecar-cumulative-visual')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: report-sidecar-cumulative-visual
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align canonical backlog with notebook-derived PDF sidecar
        run: python scripts/_tmp_align_pdf_sidecar_backlog.py
      - name: Validate migrated backlog
        run: python scripts/check_backlog_contract.py
      - name: Remove temporary migration machinery
        run: |
          rm -f \
            .github/workflows/_tmp_refresh_cumulative_visual.yml \
            .github/_tmp_refresh_trigger \
            .github/_tmp_refresh.log \
            scripts/_tmp_align_pdf_sidecar_backlog.py
      - name: Commit canonical backlog migration and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BACKLOG.md .github scripts
          git commit -m 'DOCS — Align backlog with PDF notebook-sidecar contract [skip ci]'
          git push origin HEAD:report-sidecar-cumulative-visual
