name: Temp PR23 Diagnostic 2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == 'OPS — Diagnose PR-23 notebook build phase two' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR-23 branch
        uses: actions/checkout@v4
        with:
          ref: pr-23-notebook-step-3-model-selection-selected-state-provenance
          fetch-depth: 0
      - name: Run complete build with diagnostic capture
        run: |
          set +e
          {
            set -euo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git merge --no-edit origin/main
            python --version
            python -m pip install --upgrade pip
            pip install -e ".[dev]" ipykernel
            python -m ipykernel install --user --name python3 --display-name "Python 3"
            python scripts/_tmp_build_pr23.py
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=1200 \
              notebooks/gwp2_vix_regime_allocation.ipynb
            test -s reports/tables/step3_model_comparison.csv
            test -s reports/tables/step3_selected_states.csv
            test -s reports/generated/step3_selected_model.json
          } > _tmp_pr23_build.log 2>&1
          status=$?
          cat _tmp_pr23_build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git add -f _tmp_pr23_build.log
            git commit -m "PR-23 — Capture notebook build failure" || true
            git push origin HEAD:pr-23-notebook-step-3-model-selection-selected-state-provenance
            exit "$status"
          fi
          rm _tmp_pr23_build.log
          git rm scripts/_tmp_build_pr23.py
          git add -f notebooks/gwp2_vix_regime_allocation.ipynb reports/references.bib \
            reports/tables/step3_model_comparison.csv \
            reports/tables/step3_selected_states.csv \
            reports/generated/step3_selected_model.json
          git commit -m "PR-23 — Notebook Step 3 model selection + selected-state provenance [generated]"
          git push origin HEAD:pr-23-notebook-step-3-model-selection-selected-state-provenance

  cleanup:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove diagnostic controller
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_pr23_diag2.yml
          git commit -m "OPS — Cleanup PR-23 diagnostic phase two"
          git push origin HEAD:main

# explicit second push triggers this workflow
