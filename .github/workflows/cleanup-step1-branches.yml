name: Cleanup Step 1 merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'OPS — Trigger Step 1 branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged Step 1 branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'audit/backlog-completeness-v2'
            'fix-step1-pr04-artifact-ownership'
            'fix-step1-readme-finalization'
            'pr-01-yahoo-adjusted-close-loader'
            'pr-02-step-1-common-sample-transformation'
            'pr-03-step-1-exploratory-plots'
            'pr-04-executable-step-1-pipeline'
            'pr-05-canonical-notebook-step-1'
            'pr-docs-scientific-citation-contract'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove one-shot cleanup artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SSC"
          git config user.email "sergej.schweizer@gmail.com"
          git rm .github/workflows/cleanup-step1-branches.yml
          git rm .step1-branch-cleanup-trigger
          git commit -m "OPS — Complete Step 1 branch cleanup"
          git push origin HEAD:main
