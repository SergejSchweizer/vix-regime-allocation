name: Temp PR25 Controller

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == 'OPS — Build PR-25 Step 4 notebook' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR-25 branch
        uses: actions/checkout@v4
        with:
          ref: pr-25-notebook-step-4-allocation-steps2-4-manifest
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and notebook kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ipykernel
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Build and execute canonical Step 1-4 notebook
        run: |
          python scripts/_tmp_build_pr25.py
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1200 \
            notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Verify Step 4 artifacts and notebook
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import nbformat
          import pandas as pd

          root = Path('.')
          allocation_path = root / 'reports/tables/step4_allocation_mapping.csv'
          manifest_path = root / 'reports/generated/steps_2_4_manifest.json'
          notebook_path = root / 'notebooks/gwp2_vix_regime_allocation.ipynb'
          assert allocation_path.is_file() and allocation_path.stat().st_size > 0
          assert manifest_path.is_file() and manifest_path.stat().st_size > 0

          allocation = pd.read_csv(allocation_path)
          assert list(allocation.columns) == [
              'state', 'selected_asset', 'selection_mean_log_return',
              'TLT_weight', 'GLD_weight', 'SPY_weight'
          ]
          assert allocation['state'].tolist() == [0, 1]
          assert allocation['selected_asset'].tolist() == ['SPY', 'TLT']
          assert allocation[['TLT_weight', 'GLD_weight', 'SPY_weight']].sum(axis=1).tolist() == [1.0, 1.0]

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert set(manifest) == {
              'schema_version', 'input_data_path', 'input_data_sha256',
              'notebook_path', 'selected_model_path', 'tables', 'figures'
          }
          assert manifest['schema_version'] == 1
          assert manifest['input_data_path'] == 'data/processed/step1_data.csv'
          expected_sha = hashlib.sha256((root / manifest['input_data_path']).read_bytes()).hexdigest()
          assert manifest['input_data_sha256'] == expected_sha
          assert len(manifest['tables']) == 18
          assert len(manifest['figures']) == 4
          assert manifest['tables'] == sorted(manifest['tables'])
          assert manifest['figures'] == sorted(manifest['figures'])
          assert len(set(manifest['tables'])) == len(manifest['tables'])
          assert len(set(manifest['figures'])) == len(manifest['figures'])
          for relative in manifest['tables'] + manifest['figures']:
              assert (root / relative).is_file(), relative

          nb = nbformat.read(notebook_path, as_version=4)
          markdown = '\n'.join(cell.source for cell in nb.cells if cell.cell_type == 'markdown')
          assert '## Step 4 — State-based rotation rule' in markdown
          assert 'markowitz1952portfolio' in markdown
          assert '## Works Cited' in markdown
          assert 'does not retroactively make the model estimation or allocation mapping causal or out-of-sample' in markdown
          for cell in nb.cells:
              if cell.cell_type == 'code':
                  assert cell.execution_count is not None
                  for output in cell.get('outputs', []):
                      assert output.output_type != 'error'
          PY
      - name: Commit only PR-25 owned generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_tmp_build_pr25.py
          git add -f notebooks/gwp2_vix_regime_allocation.ipynb
          git add -f reports/tables/step4_allocation_mapping.csv
          git add -f reports/generated/steps_2_4_manifest.json
          git status --short
          git commit -m "PR-25 — Notebook Step 4 allocation + Steps2–4 manifest [generated]"
          git push origin HEAD:pr-25-notebook-step-4-allocation-steps2-4-manifest

  cleanup:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove PR-25 controller from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_pr25_controller.yml
          git commit -m "OPS — Cleanup PR-25 Step 4 controller"
          git push origin HEAD:main
