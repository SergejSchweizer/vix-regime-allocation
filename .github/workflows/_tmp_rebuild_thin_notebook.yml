name: Temporary Thin Notebook Rebuild

on:
  push:
    branches:
      - notebook-thin-helper-calls

permissions:
  contents: write

jobs:
  rebuild:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'NOTEBOOK — Trigger thin notebook rebuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: notebook-thin-helper-calls
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Rebuild thin notebook
        run: python scripts/rebuild_thin_notebook.py

      - name: Execute notebook and persist outputs
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=900 \
            notebooks/gwp2_vix_regime_allocation.ipynb

      - name: Validate notebook architecture
        run: python scripts/check_notebook_thin.py

      - name: Focused quality checks
        run: |
          ruff check src/vix_regime_allocation/notebook_helpers.py scripts/rebuild_thin_notebook.py scripts/check_notebook_thin.py tests/test_notebook_helpers.py
          pytest -q tests/test_notebook_helpers.py

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/gwp2_vix_regime_allocation.ipynb
          git commit -m 'NOTEBOOK — Rebuild as helper-call-only technical report'
          git push origin HEAD:notebook-thin-helper-calls

