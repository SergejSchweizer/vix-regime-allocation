name: Temporary Thin Notebook Rebuild

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  rebuild:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'notebook-thin-helper-calls'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: notebook-thin-helper-calls
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Format support files
        run: |
          ruff check --fix \
            src/vix_regime_allocation/notebook_helpers.py \
            scripts/rebuild_analysis_review.py \
            scripts/rebuild_thin_notebook.py \
            scripts/check_notebook_thin.py \
            tests/test_notebook_helpers.py
          ruff format \
            src/vix_regime_allocation/notebook_helpers.py \
            scripts/rebuild_analysis_review.py \
            scripts/rebuild_thin_notebook.py \
            scripts/check_notebook_thin.py \
            tests/test_notebook_helpers.py

      - name: Rebuild canonical analysis artifacts
        run: python scripts/rebuild_analysis_review.py

      - name: Rebuild thin notebook
        run: python scripts/rebuild_thin_notebook.py

      - name: Execute notebook and persist outputs
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=900 \
            notebooks/gwp2_vix_regime_allocation.ipynb

      - name: Validate notebook architecture
        run: python scripts/check_notebook_thin.py

      - name: Focused quality checks
        run: |
          ruff check \
            src/vix_regime_allocation/notebook_helpers.py \
            scripts/rebuild_analysis_review.py \
            scripts/rebuild_thin_notebook.py \
            scripts/check_notebook_thin.py \
            tests/test_notebook_helpers.py
          ruff format --check \
            src/vix_regime_allocation/notebook_helpers.py \
            scripts/rebuild_analysis_review.py \
            scripts/rebuild_thin_notebook.py \
            scripts/check_notebook_thin.py \
            tests/test_notebook_helpers.py
          pytest -q tests/test_notebook_helpers.py

      - name: Commit generated canonical artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/vix_regime_allocation/notebook_helpers.py \
            scripts/rebuild_analysis_review.py \
            scripts/rebuild_thin_notebook.py \
            scripts/check_notebook_thin.py \
            tests/test_notebook_helpers.py \
            notebooks/gwp2_vix_regime_allocation.ipynb \
            reports/tables/step5_state_count_sensitivity.csv \
            reports/generated/step5_manifest.json \
            reports/figures/step1_etf_log_returns.png \
            reports/figures/step1_vix_change.png \
            reports/figures/step2_markov_vix_states.png \
            reports/figures/step2_hmm_vix_states.png \
            reports/figures/step3_state_asset_statistics.png \
            reports/figures/step5_cumulative_performance.png
          git commit -m 'NOTEBOOK — Rebuild helper-call report and canonical artifacts'
          git push origin HEAD:notebook-thin-helper-calls
