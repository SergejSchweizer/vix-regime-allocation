name: Temp Build PR21

on:
  push:
    branches:
      - pr-21-notebook-step-2-markov-canonical-states

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pr-21-notebook-step-2-markov-canonical-states
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build notebook structure
        run: python scripts/_tmp_build_pr21.py
      - name: Execute canonical notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=900 \
            notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Verify canonical outputs
        run: |
          test -s reports/tables/step2_markov_2_thresholds.csv
          test -s reports/tables/step2_markov_3_thresholds.csv
          test -s reports/tables/step2_markov_2_transition.csv
          test -s reports/tables/step2_markov_3_transition.csv
          test -s reports/tables/step2_markov_2_stationary.csv
          test -s reports/tables/step2_markov_3_stationary.csv
          test -s reports/tables/step2_markov_2_states.csv
          test -s reports/tables/step2_markov_3_states.csv
          test -s reports/figures/step2_markov_vix_states.png
      - name: Commit canonical Step 2 Markov outputs and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_tmp_build_pr21.py .github/workflows/_tmp_build_pr21.yml
          git add notebooks/gwp2_vix_regime_allocation.ipynb reports/tables reports/figures
          git commit -m "PR-21 — Notebook Step 2 Markov + canonical states [generated]"
          git push origin HEAD:pr-21-notebook-step-2-markov-canonical-states
