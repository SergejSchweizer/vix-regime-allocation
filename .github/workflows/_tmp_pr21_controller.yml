name: Temp PR21 Controller

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.head_commit.message == 'OPS — Retry PR-21 notebook build' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR-21 branch
        uses: actions/checkout@v4
        with:
          ref: pr-21-notebook-step-2-markov-canonical-states
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build, execute, diagnose, and commit
        shell: bash
        run: |
          set +e
          python scripts/_tmp_build_pr21.py > /tmp/pr21.log 2>&1
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=900 \
              notebooks/gwp2_vix_regime_allocation.ipynb >> /tmp/pr21.log 2>&1
            execute_status=$?
          else
            execute_status=99
          fi
          cat /tmp/pr21.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$build_status" -ne 0 ] || [ "$execute_status" -ne 0 ]; then
            mkdir -p reports/generated
            cp /tmp/pr21.log reports/generated/_tmp_pr21_build.log
            git add reports/generated/_tmp_pr21_build.log
            git commit -m "PR-21 — Notebook Step 2 Markov + canonical states build diagnostics"
            git push origin HEAD:pr-21-notebook-step-2-markov-canonical-states
            exit 1
          fi
          for path in \
            reports/tables/step2_markov_2_thresholds.csv \
            reports/tables/step2_markov_3_thresholds.csv \
            reports/tables/step2_markov_2_transition.csv \
            reports/tables/step2_markov_3_transition.csv \
            reports/tables/step2_markov_2_stationary.csv \
            reports/tables/step2_markov_3_stationary.csv \
            reports/tables/step2_markov_2_states.csv \
            reports/tables/step2_markov_3_states.csv \
            reports/figures/step2_markov_vix_states.png; do
            test -s "$path" || exit 1
          done
          rm -f reports/generated/_tmp_pr21_build.log
          git rm scripts/_tmp_build_pr21.py .github/workflows/_tmp_build_pr21.yml
          git add notebooks/gwp2_vix_regime_allocation.ipynb reports/tables reports/figures reports/generated
          git commit -m "PR-21 — Notebook Step 2 Markov + canonical states [generated]"
          git push origin HEAD:pr-21-notebook-step-2-markov-canonical-states

  cleanup:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove controller from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_pr21_controller.yml
          git commit -m "OPS — Cleanup PR-21 notebook build retry controller"
          git push origin HEAD:main
