name: Temporary PR-41 Notebook Build

on:
  push:
    branches: [pr-41-notebook-step5-metrics-cumulative-comparison]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'OPS — Trigger PR-41 notebook build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-41-notebook-step5-metrics-cumulative-comparison
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build and execute notebook
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
          python scripts/_tmp_build_pr41.py
          python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 notebooks/gwp2_vix_regime_allocation.ipynb
          ruff check notebooks/gwp2_vix_regime_allocation.ipynb
          test -s reports/tables/step5_performance_summary.csv
          test -s reports/figures/step5_cumulative_performance.png
      - name: Commit generated artifacts
        run: |
          rm -f scripts/_tmp_build_pr41.py .github/workflows/_tmp_pr41_build.yml .github/_tmp_pr41_trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A notebooks/gwp2_vix_regime_allocation.ipynb reports/tables/step5_performance_summary.csv reports/figures/step5_cumulative_performance.png scripts/_tmp_build_pr41.py .github/workflows/_tmp_pr41_build.yml .github/_tmp_pr41_trigger
          git commit -m 'PR-41 — Notebook Step5 metrics + cumulative comparison [generated]'
          git push origin HEAD:pr-41-notebook-step5-metrics-cumulative-comparison
