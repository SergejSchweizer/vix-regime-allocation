name: Complete Analysis Audit

on:
  push:
    branches:
      - audit/complete-verification-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-analysis:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify every persisted numerical layer
        run: python scripts/check_analysis_consistency.py
