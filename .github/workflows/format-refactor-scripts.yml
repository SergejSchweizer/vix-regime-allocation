name: Format Refactor Scripts

on:
  push:
    branches:
      - refactor/notebook-orchestration-only
    paths:
      - .github/workflows/format-refactor-scripts.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'
      - name: Format refactor scripts
        run: ruff format scripts/check_notebook_orchestration.py scripts/rebuild_analysis_review.py
      - name: Commit formatting
        run: |
          if git diff --quiet -- scripts/check_notebook_orchestration.py scripts/rebuild_analysis_review.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_notebook_orchestration.py scripts/rebuild_analysis_review.py
          git commit -m "REFACTOR — format notebook refactor scripts"
          git push
