name: Temporary Embed Cumulative Visual

on:
  push:
    branches:
      - report-sidecar-cumulative-visual

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: report-sidecar-cumulative-visual
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ipykernel
      - name: Replace runner-local Markdown image with embedded PNG display
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/vix_regime_allocation/notebook_helpers.py')
          text = path.read_text(encoding='utf-8')
          old = '    display(Markdown(f"![Cumulative performance comparison]({figure_path.as_posix()})"))'
          new = '    display(Image(filename=str(figure_path)))'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Cumulative comparison display call is neither legacy nor embedded form.')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Execute canonical notebook with embedded cumulative visual
        run: >-
          python -m jupyter nbconvert --to notebook --execute --inplace
          --ExecutePreprocessor.timeout=1200 notebooks/gwp2_vix_regime_allocation.ipynb
      - name: Validate cumulative visual and notebook contracts
        run: |
          pytest -q tests/test_notebook_cumulative_visual.py tests/test_backtest_plot.py
          python scripts/check_notebook_orchestration.py
          python scripts/check_backlog_contract.py
          test -s reports/figures/step5_cumulative_performance.png
      - name: Remove temporary workflow
        run: rm -f .github/workflows/_tmp_embed_cumulative_visual.yml
      - name: Commit embedded notebook visual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/vix_regime_allocation/notebook_helpers.py \
            notebooks/gwp2_vix_regime_allocation.ipynb \
            reports/figures/step5_cumulative_performance.png \
            .github/workflows/_tmp_embed_cumulative_visual.yml
          git commit -m 'VIS — Embed cumulative comparison in notebook [skip ci]'
          git reset --hard HEAD
          git pull --rebase origin report-sidecar-cumulative-visual
          git push origin HEAD:report-sidecar-cumulative-visual
