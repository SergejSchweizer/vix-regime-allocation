[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vix-regime-allocation"
version = "0.1.0"
description = "VIX-based volatility regime analysis and allocation for MScFE 622 GWP2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hmmlearn>=0.3.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "mypy>=1.11",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pandas-stubs>=2.2",
    "pymupdf>=1.24",
    "pypdf>=5.0",
    "pytest>=8.3",
    "reportlab>=4.2",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/rebuild_analysis_review.py" = ["E501"]
"scripts/check_predictive_causality.py" = ["E501"]
"src/vix_regime_allocation/predictive/holdout.py" = ["E501"]
"tests/predictive/test_hmm_filter.py" = ["E501"]
"tests/predictive/test_selection.py" = ["E501"]
"tests/predictive/test_state_returns.py" = ["E501"]

# Temporary legacy-format quarantine. PR-66 removes this block after the HMM-only
# revision wave has rewritten or deleted these pre-existing predictive files.
[tool.ruff.format]
exclude = [
    "scripts/check_predictive_causality.py",
    "src/vix_regime_allocation/predictive/artifacts.py",
    "src/vix_regime_allocation/predictive/hmm_filter.py",
    "src/vix_regime_allocation/predictive/holdout.py",
    "src/vix_regime_allocation/predictive/markov_forecast.py",
    "src/vix_regime_allocation/predictive/plots.py",
    "src/vix_regime_allocation/predictive/policy.py",
    "src/vix_regime_allocation/predictive/selection.py",
    "src/vix_regime_allocation/predictive/split.py",
    "src/vix_regime_allocation/predictive/state_returns.py",
    "tests/predictive/test_artifacts.py",
    "tests/predictive/test_hmm_filter.py",
    "tests/predictive/test_hmm_walkforward.py",
    "tests/predictive/test_refit.py",
    "tests/predictive/test_selection.py",
    "tests/predictive/test_state_returns.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "vix_regime_allocation.predictive.refit",
    "vix_regime_allocation.predictive.backtest",
    "vix_regime_allocation.predictive.markov_walkforward",
    "vix_regime_allocation.predictive.hmm_walkforward",
    "vix_regime_allocation.predictive.plots",
]
disable_error_code = ["arg-type", "index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: tests that verify integration between repository/application components",
]

[tool.coverage.run]
branch = true
source = ["src/vix_regime_allocation"]
relative_files = true

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
